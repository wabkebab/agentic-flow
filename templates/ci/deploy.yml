# Deploy — build, push, ship, verify. See METHODOLOGY.md §10.
#
# Shipped INERT: copy to .github/workflows/deploy.yml to activate. This one deploys —
# read it fully and fill every <ANGLE-BRACKET> before you turn it on. It assumes a
# container image pushed to GHCR and a compose stack on a remote host reached over SSH;
# if that isn't your topology, keep the structure (build → push → pull by digest →
# wait → verify from outside) and swap the mechanism.
#
# Action SHAs were current when this template shipped — re-verify on adoption (§9).

name: Deploy

on:
  push:
    branches:
      - <RELEASE BRANCH, e.g. main>
  workflow_dispatch:

# Do NOT cancel an in-flight deploy when a new push lands: finishing the current one
# is safer than half-deploying. This is the opposite of ci.yml on purpose.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # ghcr.io image push — the only write scope this workflow gets

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build and push the image ─────────────────────────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-24.04
    outputs:
      # Digest, not tag. A tag can be re-pointed between this push and the pull below;
      # the digest is exactly what was built here.
      image_ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute short SHA
        id: meta
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          # Two tags: a moving `latest` pointer for humans, plus an immutable
          # per-commit tag so a rollback has something to name.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to the remote host ────────────────────────────────────────────────
  deploy:
    name: Deploy to remote
    runs-on: ubuntu-24.04
    needs: build-push
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pin the host key from a secret rather than disabling host checking.
      # `StrictHostKeyChecking=no` would make this step trust whatever answers.
      - name: Add server to known hosts
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Allowlist, not a blocklist. Operator-maintained state on the server — the
      # runtime .env, TLS certs, data volumes — must never be in the sync set.
      - name: Sync deploy assets
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz \
            --include='docker-compose.prod.yml' \
            --include='<OTHER DEPLOY ASSETS>' \
            --exclude='*' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Pull image and restart
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_REF: ${{ needs.build-push.outputs.image_ref }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             cd \"$DEPLOY_PATH\"
             export <IMAGE ENV VAR>='$IMAGE_REF'
             docker compose -f docker-compose.prod.yml pull <SERVICE>
             docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120"

      # `--wait` above proves the container reports healthy; this proves the thing is
      # actually reachable end-to-end (proxy, TLS, DNS). Bounded retries — a fresh
      # container is often a few seconds behind the compose exit.
      - name: External healthcheck
        env:
          DEPLOY_PUBLIC_URL: ${{ secrets.DEPLOY_PUBLIC_URL }}
        run: |
          set -eu
          if [ -z "${DEPLOY_PUBLIC_URL:-}" ]; then
            echo "DEPLOY_PUBLIC_URL not set — skipping external healthcheck"
            exit 0
          fi
          url="${DEPLOY_PUBLIC_URL%/}/health"
          attempts=10
          delay=3
          for i in $(seq 1 $attempts); do
            if curl --fail --silent --show-error \
                    --max-time 5 --location \
                    --write-out 'http=%{http_code} time=%{time_total}s\n' \
                    "$url"; then
              echo "external healthcheck ok (attempt $i)"
              exit 0
            fi
            echo "attempt $i/$attempts failed; retrying in ${delay}s..."
            sleep $delay
          done
          echo "external healthcheck failed after $attempts attempts" >&2
          exit 1

# ─────────────────────────────────────────────────────────────────────────────
# RUNBOOK — keep this block current. It is the only place the one-time setup is
# written down, and the person who needs it will be reading this file at 2am.
#
#   Required repository secrets:
#     DEPLOY_SSH_KEY      — private key whose public key is in the server's authorized_keys
#     DEPLOY_HOST_KEY     — output of: ssh-keyscan <host>
#     DEPLOY_USER         — SSH user on the server
#     DEPLOY_HOST         — server hostname or IP
#     DEPLOY_PATH         — absolute path to the deploy directory on the server
#     DEPLOY_PUBLIC_URL   — public base URL for the external healthcheck
#
#   One-time server setup (NOT run by this workflow):
#     1. Make the GHCR package public, or log in once on the server:
#          echo "<github-pat-with-read:packages>" | \
#            docker login ghcr.io -u <github-user> --password-stdin
#     2. Create DEPLOY_PATH and put the runtime .env there. This workflow never
#        writes it — list the required variables here.
#     3. <TLS certs, shared docker networks, data volumes, anything else the
#        workflow assumes exists and will not create.>
# ─────────────────────────────────────────────────────────────────────────────
