# Native Release — build and attach per-platform binaries when a version tag is pushed.
# See docs/reference/ci-cd.md for the reasoning behind this shape.
#
# Shipped INERT: copy to .github/workflows/release-native.yml to activate. Fill every
# <ANGLE-BRACKET> spot and the native-build block in each platform job before you turn it
# on. This only fits a stack that compiles to a standalone native binary (Go, Rust, a
# bundled/compiled Node CLI, …) — an interpreted stack deployed as a service has nothing to
# attach here and should rely on deploy.yml instead, not both.
#
# Action SHAs below were current when this template shipped. Re-verify them against the
# latest releases when you adopt it (docs/reference/stack-assessment.md) — a pin you inherited is not a
# version you chose.
#
# Action pins verified: 2026-07-25
# Checked by scripts/check-action-pins.sh. After re-verifying, run it with --stamp.

name: Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write   # create the release and upload assets — the only write scope this needs

jobs:
  # ── Resolve the tag once, create the release shell ───────────────────────────
  # Every build job below uploads to this same tag_name, whether the run came from an
  # actual tag push or a manual dispatch (e.g. re-running one platform without re-tagging).
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # A hyphen in the tag (v1.2.3-rc1, v1.2.3-beta.2) marks a prerelease — SemVer's own
      # pre-release convention, so this needs no separate input to drift out of sync with
      # the tag that triggered the run.
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.value, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build, package, and attach — one job per OS ───────────────────────────────
  # Three explicit jobs rather than one OS-matrixed job: packaging genuinely differs per OS
  # (tar.gz vs zip, binary extension, shell), so three short jobs are easier to fill in per
  # platform than one job branching three ways internally. Drop whichever platform your
  # stack doesn't target; add more `matrix.include` rows for additional architectures.
  build-linux:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: <TARGET TRIPLE, e.g. x86_64-unknown-linux-gnu>
            artifact_name: <PROJECT>-linux-<ARCH, e.g. x86_64>

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set archive name
        id: archive
        run: echo "name=${{ matrix.artifact_name }}-${{ needs.create-release.outputs.tag }}.tar.gz" >> "$GITHUB_OUTPUT"

      # ── Replace this block with your stack's native build ────────────────────
      # Produce one standalone binary for `matrix.target`. Install/build from the
      # lockfile/manifest — same rule as ci.yml's runtime-setup block: a build that
      # resolves dependencies fresh here can silently diverge from what was tested.
      - name: Build release binary
        run: <BUILD COMMAND, e.g. cargo build --release --locked --target ${{ matrix.target }}>
      # ── End native build ──────────────────────────────────────────────────────

      - name: Smoke-test built binary
        run: |
          BIN=<PATH TO BUILT BINARY, e.g. target/${{ matrix.target }}/release/<PROJECT>>
          test -x "$BIN" || { echo "binary missing or not executable: $BIN"; exit 1; }
          # If your CLI has a --version flag, compare its output against the tag here —
          # a mismatch means the wrong build artifact would ship under this release.

      - name: Package release archive
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp <PATH TO BUILT BINARY> dist/${{ matrix.artifact_name }}/
          cp README.md dist/${{ matrix.artifact_name }}/
          tar -C dist -czf dist/${{ steps.archive.outputs.name }} ${{ matrix.artifact_name }}

      - name: Upload release archive
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/${{ steps.archive.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: <TARGET TRIPLE, e.g. aarch64-apple-darwin>
            artifact_name: <PROJECT>-macos-<ARCH, e.g. aarch64>

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set archive name
        id: archive
        run: echo "name=${{ matrix.artifact_name }}-${{ needs.create-release.outputs.tag }}.tar.gz" >> "$GITHUB_OUTPUT"

      # ── Replace this block with your stack's native build ────────────────────
      - name: Build release binary
        run: <BUILD COMMAND, e.g. cargo build --release --locked --target ${{ matrix.target }}>
      # ── End native build ──────────────────────────────────────────────────────

      - name: Smoke-test built binary
        run: |
          BIN=<PATH TO BUILT BINARY>
          test -x "$BIN" || { echo "binary missing or not executable: $BIN"; exit 1; }

      - name: Package release archive
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp <PATH TO BUILT BINARY> dist/${{ matrix.artifact_name }}/
          cp README.md dist/${{ matrix.artifact_name }}/
          tar -C dist -czf dist/${{ steps.archive.outputs.name }} ${{ matrix.artifact_name }}

      - name: Upload release archive
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/${{ steps.archive.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build <TARGET TRIPLE, e.g. x86_64-pc-windows-msvc>
    needs: create-release
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set archive name
        id: archive
        shell: pwsh
        run: echo "name=<PROJECT>-windows-<ARCH, e.g. x86_64>-${{ needs.create-release.outputs.tag }}.zip" >> $env:GITHUB_OUTPUT

      # ── Replace this block with your stack's native build ────────────────────
      - name: Build release binary
        shell: pwsh
        run: <BUILD COMMAND>
      # ── End native build ──────────────────────────────────────────────────────

      - name: Smoke-test built binary
        shell: pwsh
        run: |
          $bin = "<PATH TO BUILT BINARY, e.g. target\x86_64-pc-windows-msvc\release\<PROJECT>.exe>"
          if (-not (Test-Path $bin)) { throw "binary missing: $bin" }

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/<PROJECT>-windows-<ARCH>" -Force | Out-Null
          Copy-Item "<PATH TO BUILT BINARY>" "dist/<PROJECT>-windows-<ARCH>/"
          Copy-Item "README.md" "dist/<PROJECT>-windows-<ARCH>/"
          Compress-Archive -Path "dist/<PROJECT>-windows-<ARCH>/*" -DestinationPath "dist/${{ steps.archive.outputs.name }}" -Force

      - name: Upload release archive
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/${{ steps.archive.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# RUNBOOK
#
#   Cutting a release:
#     git tag v1.2.3 && git push origin v1.2.3
#   or, to re-run without re-tagging (e.g. one platform failed): dispatch this workflow
#   manually with the same tag as `tag`.
#
#   Required repository secrets: none beyond the default GITHUB_TOKEN — softprops/
#   action-gh-release uses it to create the release and upload assets.
#
#   No SBOM job ships here — attaching one is stack-specific (e.g. cargo-cyclonedx for
#   Rust, cyclonedx-npm for Node, cyclonedx-py for Python). Add a job that generates one
#   and uploads it the same way as a release archive above, if you need it.
# ─────────────────────────────────────────────────────────────────────────────
