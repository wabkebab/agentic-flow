# CI — pull-request gate. See METHODOLOGY.md §10 for the reasoning behind this shape.
#
# Active in this repository. The adopter-facing copy remains inert under templates/ci/.
# Runtime setup is intentionally empty here because agentic-flow is a bash/make harness.
#
# Action SHAs below were current when this template shipped. Re-verify them against the
# latest releases when you adopt it (METHODOLOGY.md §9) — pinning is only useful if the
# pin is a version you actually chose.
#
# Action pins verified: 2026-07-24
# Checked by scripts/check-action-pins.sh. After re-verifying, run it with --stamp.

name: CI

on:
  pull_request:

permissions:
  contents: read
  # dorny/paths-filter calls the GitHub Pulls API to list changed files; without this
  # scope it errors with "Resource not accessible by integration" on hardened repos
  # and forked-PR contexts.
  pull-requests: read

# Cancel superseded runs when a PR is updated — the old run's verdict is already stale.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Detect what changed ──────────────────────────────────────────────────────
  # Gates the expensive jobs so a docs-only PR doesn't pay for a full build.
  # Every filter includes this workflow file, so editing CI re-runs what it gates.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            app:
              - 'scripts/**'
              - 'Makefile'
              - 'config/**'
              - 'profiles/**'
              - 'templates/**'
              - '.claude/**'
              - '.codex/**'
              - '.agents/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '*.md'
              - '.github/workflows/ci.yml'

  # ── Secrets scan ─────────────────────────────────────────────────────────────
  # Deliberately NOT path-filtered: a credential can land in any file.
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan PR diff for verified leaked secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # --only-verified: report a finding only when the credential is confirmed live.
          # Without it the noise floor trains everyone to ignore this job.
          extra_args: --only-verified

  # ── The gate itself ──────────────────────────────────────────────────────────
  # Steps stay thin and call Make targets: CI green must mean the same thing as
  # local green. If something here can't be a Make target, the Makefile is incomplete.
  app:
    name: App checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Test suite's export fixture reads pre-F-7 artifacts from repository
          # history; the default depth-1 clone cannot resolve them.
          fetch-depth: 0

      # `make test` lints the harness scripts with ShellCheck. Pin the version the suite is
      # verified against: ubuntu-24.04 ships 0.9.0, which reports the hooks' indirectly
      # invoked callbacks as unreachable (SC2317), and a runner image update can change it.
      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$archive"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"

      # This repository is the harness itself: bash/make only, no language runtime
      # setup, lockfile install, or package audit is required here.
      - name: Preflight runner tools
        run: |
          missing=""
          for t in bash make git jq shellcheck; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            # shellcheck disable=SC2086
            sudo apt-get install -y $missing
          fi
          for t in bash make git jq shellcheck; do
            command -v "$t" >/dev/null || { echo "preflight: $t still missing" >&2; exit 1; }
          done
          bash --version | head -1
          make --version | head -1
          git --version
          jq --version
          shellcheck --version | sed -n '1,2p'

      - name: Fast gate (type-check + lint)
        run: make check
      - name: Repo-scope scaffold doctor
        run: scripts/doctor.sh --check --scope repo --skip-make-check
      # TEMPORARY diagnostic for PR #161 (2026-11-18): make test was killed twice by a
      # SIGTERM after the self-test passed. The kernel audit log records every SIGTERM
      # sent on the runner with the sender's pid, parent, command and target, without
      # tracing the suite itself. Remove the two diagnostic steps once the sender is known.
      - name: Record SIGTERM senders (diagnostic)
        run: |
          sudo apt-get install -y -qq auditd >/dev/null 2>&1 || true
          sudo systemctl start auditd 2>/dev/null || sudo service auditd start 2>/dev/null || true
          sudo auditctl -b 65536 || true
          sudo auditctl -a always,exit -F arch=b64 -S kill -F a1=15 -k term || true
          sudo auditctl -a always,exit -F arch=b64 -S tkill -F a1=15 -k term || true
          sudo auditctl -a always,exit -F arch=b64 -S tgkill -F a2=15 -k term || true
          sudo auditctl -l || true
      # The diagnostic monitor below streams into this step's own log, so it survives
      # a runner-level cancel, which skips every later step (run 44389170564).
      - name: Test suite
        run: |
          set +e
          (
            while :; do
              echo "[monitor $(date -u +%H:%M:%S)] $(free -m | awk '/^Mem:/{print "mem used=" $3 "M avail=" $7 "M"}')$(free -m | awk '/^Swap:/{print " swap used=" $3 "M"}') $(df -m / /tmp | awk 'NR>1{printf "%s used=%sM avail=%sM ", $6, $3, $4}')"
              ps -eo rss=,pid=,ppid=,comm= --sort=-rss | head -3 | awk '{printf "[monitor]   top %dM pid=%s ppid=%s %s\n", $1/1024, $2, $3, $4}'
              sleep 15
            done
          ) &
          monitor=$!
          sudo dmesg -w 2>/dev/null | grep --line-buffered -iE 'oom|out of memory|killed process' | sed -u 's/^/[kernel] /' &
          kernel=$!
          sudo tail -n0 -F /var/log/audit/audit.log 2>/dev/null \
            | grep --line-buffered -E 'type=OBJ_PID .*ocomm="(make|shellcheck|shell-inventory|Runner\.Worker|Runner\.Listener)"' \
            | while IFS= read -r line; do
                serial=$(printf '%s\n' "$line" | sed -n 's/.*msg=audit([0-9.]*:\([0-9]*\)).*/\1/p')
                echo "[term] $line"
                [ -n "$serial" ] && sudo ausearch -a "$serial" -i 2>/dev/null | grep -E 'type=SYSCALL|type=PROCTITLE' | sed 's/^/[term]   /'
              done &
          audit=$!
          bash -c 'printf "%s %s\n" "$$" "$(ps -o pgid= -p $$ | tr -d " ")" > "$RUNNER_TEMP/make.pid"; exec make test'
          status=$?
          kill "$monitor" "$kernel" "$audit" 2>/dev/null
          exit "$status"
      - name: Show SIGTERM senders (diagnostic)
        if: always()
        run: |
          read -r make_pid make_pgid < "$RUNNER_TEMP/make.pid" || true
          echo "make pid=$make_pid pgid=$make_pgid"
          sudo ausearch -k term -i > "$RUNNER_TEMP/term.txt" 2>/dev/null || true
          echo "SIGTERM records: $(grep -c 'type=SYSCALL' "$RUNNER_TEMP/term.txt" || true)"
          echo "--- records naming make's pid or group, or pid 0 / -1:"
          grep -B2 -A6 -E "a0=($make_pid|-$make_pgid|0|-1)( |$)|opid=$make_pid( |$)" "$RUNNER_TEMP/term.txt" | head -200 || true
          echo "--- last 40 SIGTERM records:"
          awk '/^----/{n++} {r[n]=r[n] $0 "\n"} END{for(i=(n>40?n-40:0);i<=n;i++) printf "%s", r[i]}' "$RUNNER_TEMP/term.txt" || true
      - name: Build
        run: make build

  docs:
    name: Docs index
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docs index is derived, not hand-edited
        run: scripts/docs-index.sh --check

  # ── Required-status gate ──────────────────────────────────────────────────────
  # Make THIS the only required status check in branch protection.
  #
  # Path-filtered jobs skip; a skipped job never reports a status; a required check
  # that never reports blocks the PR forever. So the jobs above cannot be named as
  # required checks directly. This one always reports: `skipped` passes, `failure`
  # and `cancelled` fail. Add every new job to `needs` AND to the loop below —
  # a job missing from the loop is a job nothing enforces.
  ci-gate:
    name: CI gate
    needs: [changes, secrets-scan, app, docs]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Assert no upstream job failed or was cancelled
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Detect changes ended in '${{ needs.changes.result }}'"
            exit 1
          fi

          for result in \
            "${{ needs.secrets-scan.result }}" \
            "${{ needs.app.result }}" \
            "${{ needs.docs.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Upstream job ended in '$result'"; exit 1 ;;
            esac
          done
